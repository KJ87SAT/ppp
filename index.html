<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TARGET 1900 学習ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Spectral:ital,wght@0,400;0,600;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#EEF0F4;
  --ink:#14181F;
  --ink-soft:#5B6472;
  --ink-faint:#8B93A2;
  --border:#DDE1E8;
  --accent:#2F6F4F;
  --accent-dk:#1F4E37;
  --accent-pale:#E1F0E7;
  --accent2:#B5701E;
  --accent2-pale:#F6E9D6;
  --danger:#B23A32;
  --danger-pale:#F8E4E2;
  --shadow: 0 1px 0 rgba(20,24,31,.03), 0 8px 20px -12px rgba(20,24,31,.18);
  --radius: 10px;
}
[data-theme="dark"]{
  --bg:#0F1219;
  --surface:#171B24;
  --surface-2:#1E2330;
  --ink:#E7EAF0;
  --ink-soft:#9AA3B2;
  --ink-faint:#69707F;
  --border:#2A3040;
  --accent:#4FAE7B;
  --accent-dk:#3D8C63;
  --accent-pale:#193226;
  --accent2:#DDA152;
  --accent2-pale:#2E2419;
  --danger:#E0685D;
  --danger-pale:#301C1B;
  --shadow: 0 1px 0 rgba(0,0,0,.2), 0 10px 26px -14px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New', sans-serif;
  min-height:100vh;
  transition:background .2s, color .2s;
  padding-bottom:60px;
}
::selection{ background:var(--accent-pale); }

/* ===== Header ===== */
header.top{
  padding:22px 28px 16px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.brand{display:flex; align-items:center; gap:12px;}
.brand .mark{
  font-family:'Spectral', serif; font-weight:700; font-size:14px; font-style:italic;
  background:var(--accent); color:#fff; padding:5px 10px; border-radius:6px;
  letter-spacing:.04em;
}
.brand h1{
  font-family:'Zen Kaku Gothic New', sans-serif; font-weight:900; font-size:20px; margin:0;
  letter-spacing:.01em;
}
.brand .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
.headstats{ display:flex; gap:20px; font-size:12px; color:var(--ink-soft); align-items:center;}
.headstats b{ display:block; font-family:'Spectral',serif; font-size:19px; color:var(--ink); font-weight:700;}
.headstats span.lbl{display:block; margin-top:1px;}
.hs-mastered b{color:var(--accent);}
.hs-review b{color:var(--danger);}
.theme-toggle{
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft);
  border-radius:20px; padding:7px 12px; cursor:pointer; font-size:12.5px; font-weight:700;
  display:flex; align-items:center; gap:6px;
}
.theme-toggle:hover{ color:var(--ink); border-color:var(--accent); }

/* ===== Mode menu (hamburger) ===== */
.menu-bar{ padding:14px 28px 0; display:flex; gap:10px; flex-wrap:wrap; }
.menu-group{ position:relative; }
.menu-group.hidden{ display:none; }
.menu-toggle{
  font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:13.5px;
  display:inline-flex; align-items:center; gap:10px; padding:10px 16px;
  border-radius:12px; border:1px solid var(--border); background:var(--surface);
  color:var(--ink); cursor:pointer; transition:.12s; max-width:100%;
}
.menu-toggle:hover{ border-color:var(--accent); }
.menu-toggle-icon{ font-size:15px; line-height:1; }
.menu-toggle-label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.menu-toggle-caret{ color:var(--ink-faint); font-size:11px; margin-left:auto; }
/* 出題範囲メニューは色を変えてモードメニューと見分けやすくする */
.range-toggle{ border-color:var(--accent2); color:var(--accent2); }
.range-toggle:hover{ border-color:var(--accent2); }
.range-toggle .menu-toggle-caret{ color:var(--accent2); opacity:.7; }
.mode-panel-overlay{
  display:none; position:fixed; inset:0; background:rgba(20,24,31,.35); z-index:40;
}
.mode-panel-overlay.open{ display:block; }
.mode-panel{
  display:none; grid-template-columns:repeat(3, 180px); gap:8px;
  position:absolute; top:100%; left:0; margin-top:8px; z-index:50;
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); padding:12px; max-height:70vh; overflow-y:auto;
  width:max-content; max-width:calc(100vw - 56px);
}
.mode-panel.open{ display:grid; }
.range-panel{
  display:none;
  position:absolute; top:100%; left:0; margin-top:8px; z-index:50;
  background:var(--surface); border:1px solid var(--accent2); border-radius:14px;
  box-shadow:var(--shadow); padding:12px; max-height:70vh; overflow-y:auto;
  width:min(520px, calc(100vw - 56px));
}
.range-panel.open{ display:block; }
.tabbtn{
  font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:13px;
  padding:11px 15px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--ink-soft); cursor:pointer; transition:.12s;
  text-align:left; width:100%;
}
.tabbtn:hover{ color:var(--ink); border-color:var(--accent); }
.tabbtn.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
[data-theme="dark"] .tabbtn.active{ background:var(--accent); color:#0F1219; border-color:var(--accent); }
@media (max-width:680px){
  .menu-bar{ padding:12px 16px 0; }
  .menu-group{ flex:1 1 auto; min-width:0; }
  .menu-toggle{ width:100%; }
  .mode-panel{ grid-template-columns:1fr; width:auto; max-width:none; right:0; }
  .range-panel{ width:auto; max-width:none; right:0; }
}

/* ===== Main panel ===== */
main{
  margin:16px 28px 0; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; min-height:520px;
}
@media (max-width:680px){
  header.top{padding:16px 16px 12px;} main{margin:14px 12px 0; padding:16px;}
  .savebar{margin:16px 12px 0 !important;}
}
@media (max-width:480px){
  header.top{ gap:10px; }
  .brand h1{ font-size:17px; }
  .brand .sub{ font-size:10.5px; }
  .headstats{ gap:12px; font-size:11px; width:100%; justify-content:space-between; }
  .headstats b{ font-size:16px; }
  .theme-toggle{ padding:6px 9px; font-size:11.5px; }
  main{ padding:14px; min-height:0; }
  .flashcard{ min-height:200px; padding:22px 16px 18px; }
  .flashcard .face{ font-size:28px; }
  .flashcard .face.ja{ font-size:18px; }
  .quiz-q{ padding:20px 14px; }
  .quiz-q .prompt.en{ font-size:24px; }
  .quiz-q .prompt{ font-size:17px; }
  .btn{ font-size:12.5px; padding:9px 13px; }
  .savebar{ font-size:11px; }
  .savebar span{ flex-basis:100%; }
  table.wordtable{ font-size:12px; }
}

/* ===== Section picker ===== */
.picker-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.picker-title{ font-weight:700; font-size:14.5px;}
.section-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; margin-bottom:6px;}
.sec-btn{
  font-family:'Spectral',serif; font-size:12.5px; font-weight:600;
  background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px 6px 10px;
  cursor:pointer; text-align:center; color:var(--ink-soft); position:relative; transition:.12s;
}
.sec-btn small{ display:block; font-family:'Zen Kaku Gothic New',sans-serif; font-size:9.5px; color:var(--ink-faint); font-weight:400; margin-top:1px;}
.sec-btn:hover{ border-color:var(--accent); color:var(--accent-dk); }
.sec-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent-dk); }
.sec-btn.active small{ color:#DDEEE1; }
.sec-progress{ height:3px; background:var(--border); border-radius:99px; margin-top:6px; overflow:hidden;}
.sec-progress i{ display:block; height:100%; background:var(--accent);}
.sec-btn.active .sec-progress{ background:rgba(255,255,255,.35); }
.sec-btn.active .sec-progress i{ background:#fff; }

.chiprow{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{
  font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--ink-soft); cursor:pointer;
}
.chip:hover{ border-color:var(--accent); color:var(--accent-dk);}
.chip.active{ background:var(--ink); color:var(--bg); border-color:var(--ink);}
.chip.warn.active{ background:var(--danger); border-color:var(--danger); color:#fff;}

hr.tear{ border:none; border-top:1px solid var(--border); margin:16px 0; }

/* ===== Flashcard ===== */
.card-stage{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:4px 0;}
.progress-line{ width:100%; max-width:560px; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-soft); }
.progress-bar{ flex:1; height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
.progress-bar i{ display:block; height:100%; background:var(--accent); width:0%; transition:.25s; }

.flashcard{
  width:100%; max-width:560px; min-height:250px; background:var(--surface-2); border:1px solid var(--border);
  border-radius:14px; position:relative; cursor:pointer;
  padding:30px 26px 22px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; user-select:none; overflow:hidden;
}
.flashcard .no{ font-family:'Spectral',serif; font-size:12px; color:var(--ink-faint); letter-spacing:.08em; margin-bottom:12px;}
.flashcard .face{ font-family:'Spectral',serif; font-weight:700; font-size:38px; color:var(--ink); line-height:1.25; word-break:break-word;}
.flashcard .face.ja{ font-family:'Zen Kaku Gothic New',serif; font-size:21px; font-weight:700; max-width:440px;}
.flashcard .hint{ margin-top:14px; font-size:11.5px; color:var(--ink-faint); }
.flashcard .stamp{
  position:absolute; font-family:'Zen Kaku Gothic New',serif; font-weight:900; font-size:46px;
  border:5px solid currentColor; border-radius:12px; padding:2px 12px; opacity:0;
  transform:scale(2.4) rotate(-10deg); pointer-events:none; letter-spacing:.05em;
}
.flashcard .stamp.show{ animation:stampIn .38s cubic-bezier(.2,1.4,.5,1) forwards; }
.flashcard .stamp.ok{ color:var(--accent); top:14px; right:18px; }
.flashcard .stamp.ng{ color:var(--danger); top:14px; right:18px; }
@keyframes stampIn{ 0%{opacity:0; transform:scale(2.4) rotate(-10deg);} 60%{opacity:1;} 100%{opacity:.92; transform:scale(1) rotate(-6deg);} }

.example-box{
  width:100%; max-width:560px; background:var(--accent2-pale); border:1px solid var(--border); border-radius:10px;
  padding:12px 16px; font-size:13px; color:var(--ink); display:none;
}
.example-box.show{ display:block; }
.example-box .en{ font-family:'Spectral',serif; font-style:italic; }
.example-box .ja{ color:var(--ink-soft); margin-top:4px; font-size:12.5px;}

.flash-audio-row{ display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
.btn.ghost.toggle-on{ background:var(--accent-pale); color:var(--accent-dk); border-color:var(--accent); }
.card-controls{ display:flex; gap:10px; margin-top:2px; flex-wrap:wrap; justify-content:center; }
.btn{
  font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:13.5px; padding:10px 17px;
  border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer;
  transition:.12s; display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{ transform:translateY(-1px); box-shadow:0 4px 10px -6px rgba(20,24,31,.4); }
.btn:active{ transform:translateY(0); }
.btn.primary{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
[data-theme="dark"] .btn.primary{ background:var(--accent); color:#0F1219; border-color:var(--accent);}
.btn.ok{ background:var(--accent-pale); color:var(--accent-dk); border-color:var(--accent);}
.btn.ng{ background:var(--danger-pale); color:var(--danger); border-color:var(--danger);}
.btn.ghost{ background:transparent; }
.btn:disabled{ opacity:.4; cursor:default; }
.kbd{ font-family:'Spectral',serif; font-size:10.5px; background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:0 5px; color:var(--ink-soft);}

.navrow{ display:flex; align-items:center; gap:14px; font-size:12.5px; color:var(--ink-soft); }
.navrow button{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:18px; padding:2px 8px;}
.navrow button:hover{ color:var(--accent-dk); }

/* ===== Quiz / Spell / Listen ===== */
.quiz-wrap{ max-width:600px; margin:0 auto; text-align:center; }
.quiz-q{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:28px 22px; position:relative;}
.quiz-q .no{ font-family:'Spectral',serif; font-size:12px; color:var(--ink-faint);}
.quiz-q .prompt{ font-weight:700; font-size:21px; margin-top:10px; line-height:1.5;}
.quiz-q .prompt.en{ font-family:'Spectral',serif; font-size:32px; font-weight:700;}
.choices{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px;}
@media (max-width:520px){ .choices{grid-template-columns:1fr;} }
.choice{
  font-family:'Zen Kaku Gothic New',sans-serif; font-size:14px; text-align:left; padding:13px 14px;
  border:1px solid var(--border); border-radius:9px; background:var(--surface); cursor:pointer; display:flex; gap:8px;
  color:var(--ink);
}
.choice:hover{ border-color:var(--accent); }
.choice.correct{ background:var(--accent-pale); border-color:var(--accent); }
.choice.wrong{ background:var(--danger-pale); border-color:var(--danger); }
.choice.dim{ opacity:.5; }

.spell-input{
  width:100%; max-width:320px; font-family:'Spectral',serif; font-size:22px; text-align:center;
  padding:12px 14px; border:2px solid var(--border); border-radius:10px; margin-top:20px; outline:none;
  background:var(--surface); color:var(--ink);
}
.spell-input:focus{ border-color:var(--accent); }
.spell-fb{ margin-top:14px; font-size:14px; min-height:22px; }
.spell-fb.ok{ color:var(--accent-dk); font-weight:700; }
.spell-fb.ng{ color:var(--danger); font-weight:700; }

.quiz-footer{ display:flex; justify-content:center; gap:10px; margin-top:18px; flex-wrap:wrap;}
.streak{ margin-top:14px; font-size:12px; color:var(--ink-soft); }
.streak b{ color:var(--accent2); }

.listen-play{
  width:84px; height:84px; border-radius:50%; border:2px solid var(--accent); background:var(--accent-pale);
  color:var(--accent-dk); font-size:30px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  margin:6px auto 4px;
}
.listen-play:hover{ background:var(--accent); color:#fff; }
.listen-rate{ display:flex; gap:6px; justify-content:center; margin-top:8px; }
.rate-btn{ font-size:11.5px; padding:4px 10px; border-radius:14px; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); cursor:pointer;}
.rate-btn.active{ background:var(--ink); color:var(--bg); border-color:var(--ink);}

/* ===== List mode ===== */
.list-controls{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
#wt-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.search{ flex:1; min-width:180px; font-family:'Zen Kaku Gothic New',sans-serif; font-size:13.5px; padding:9px 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink);}
table.wordtable{ width:100%; border-collapse:collapse; font-size:13.5px;}
table.wordtable th{ text-align:left; font-weight:700; color:var(--ink-soft); font-size:11.5px; padding:6px 10px; border-bottom:2px solid var(--ink);}
table.wordtable td{ padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
table.wordtable tr:hover td{ background:var(--surface-2); }
.wt-no{ font-family:'Spectral',serif; color:var(--ink-faint); width:44px;}
.wt-word{ font-family:'Spectral',serif; font-weight:700; width:150px; cursor:pointer;}
.wt-word:hover{ color:var(--accent-dk); text-decoration:underline;}
.badge{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:99px;}
.badge.new{ background:var(--surface-2); color:var(--ink-faint); }
.badge.review{ background:var(--danger-pale); color:var(--danger);}
.badge.mastered{ background:var(--accent-pale); color:var(--accent-dk);}
.jumpbtn{ background:none; border:1px solid var(--border); border-radius:6px; font-size:11px; padding:3px 8px; cursor:pointer; color:var(--ink-soft);}
.jumpbtn:hover{ border-color:var(--accent); color:var(--accent-dk);}
.ex-row td{ background:var(--surface-2); font-size:12.5px; color:var(--ink-soft); padding:8px 10px 12px;}
.ex-row .en{ font-family:'Spectral',serif; font-style:italic; color:var(--ink);}

/* ===== Dashboard ===== */
.dash-grid{ display:grid; grid-template-columns:1.1fr 1fr; gap:16px; }
@media (max-width:820px){ .dash-grid{ grid-template-columns:1fr; } }
.dash-card{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:18px; }
.dash-card h3{ margin:0 0 12px; font-size:14px; font-weight:700; }
.dash-card.wide{ grid-column:1 / -1; }
.dash-stats{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:6px;}
.dash-stat b{ display:block; font-family:'Spectral',serif; font-size:24px; }
.dash-stat span{ font-size:11.5px; color:var(--ink-soft); }
.chart-wrap{ position:relative; height:220px; }
.chart-wrap.small{ height:170px; }
.weak-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; max-height:260px; overflow-y:auto;}
.weak-list li{ display:flex; align-items:center; justify-content:space-between; padding:7px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); font-size:13px; cursor:pointer;}
.weak-list li:hover{ border-color:var(--danger); }
.weak-list .w{ font-family:'Spectral',serif; font-weight:700;}
.weak-list .c{ font-size:11px; color:var(--danger); font-weight:700;}
.sec-bars{ display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto; }
.sec-bar-row{ display:grid; grid-template-columns:70px 1fr 40px; align-items:center; gap:8px; font-size:12px; color:var(--ink-soft);}
.sec-bar-track{ height:8px; background:var(--surface); border:1px solid var(--border); border-radius:99px; overflow:hidden;}
.sec-bar-track i{ display:block; height:100%; background:var(--accent); }

/* ===== Range picker ===== */
.range-wrap{ max-width:560px; margin:0 auto; }
.range-inputs{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.range-inputs label{ display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft); font-weight:700; }
.range-input{
  width:110px; font-family:'Spectral',serif; font-size:18px; text-align:center;
  padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink);
}
.range-input:focus{ outline:none; border-color:var(--accent); }
.range-sep{ font-family:'Spectral',serif; font-size:16px; color:var(--ink-faint); margin-top:16px; }
.range-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:8px; }
.range-err{ font-size:12.5px; color:var(--danger); font-weight:700; min-height:18px; margin-top:4px; }
.range-modes{ display:flex; gap:10px; flex-wrap:wrap; }
.range-count{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

/* ===== Stats footer / save bar ===== */
.savebar{
  margin:16px 28px 0; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  font-size:12px; color:var(--ink-soft);
}
.savebar .btn{ font-size:12.5px; padding:8px 13px; }
.hidden{ display:none !important; }
.empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px;}

/* ===== Phonetic ===== */
.phonetic{ font-family:'Spectral',serif; font-style:italic; font-size:14px; color:var(--ink-soft); margin-top:2px; min-height:18px;}
.phonetic.loading{ opacity:.5; }
.wt-phon{ font-family:'Spectral',serif; font-style:italic; font-size:11.5px; color:var(--ink-faint); display:block; margin-top:1px;}

/* ===== SRS due badge ===== */
.due-pill{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
  background:var(--accent2-pale); color:var(--accent2); border:1px solid var(--accent2); border-radius:999px; padding:4px 10px;
}
.srs-info{ font-size:12px; color:var(--ink-soft); margin-top:8px; text-align:center; }

<script type="module">
let WORDS = [];
const WORD_SECTION_COUNT = 19;
try {
  const files = Array.from({length: WORD_SECTION_COUNT}, (_, i) => `words/section-${String(i+1).padStart(2,'0')}.json`);
  const chunks = await Promise.all(files.map(url => fetch(url).then(r => {
    if(!r.ok) throw new Error(`${url} の読み込みに失敗しました (${r.status})`);
    return r.json();
  })));
  WORDS = chunks.flat();
} catch (e) {
  console.error('単語データの読み込みに失敗しました:', e);
  document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;line-height:1.8;">単語データ（<code>words/</code>フォルダ内のJSONファイル）の読み込みに失敗しました。<br>index.html と同じ場所に <code>words</code> フォルダを置き、ローカルサーバー経由（例: <code>python3 -m http.server</code>）で開いてください。<br>file:// で直接開くと読み込めない場合があります。</div>';
  throw e;
}

/* ---------- storage ---------- */
const LS_PROGRESS = 'target1900_progress_v3';
const LS_HISTORY = 'target1900_history_v2';
const LS_THEME = 'target1900_theme';
const LS_SETTINGS = 'target1900_settings_v1';
const LS_META = 'target1900_meta_v1';
const LS_PHONETIC = 'target1900_phonetic_v1';

function freshSRS(){
  return { reps:0, interval:0, ease:2.5, due: Date.now(), lastReview: null };
}

const progress = {};
WORDS.forEach(w => progress[w.no] = {status:'new', correct:0, wrong:0, srs:freshSRS()});

let history = {}; // 'YYYY-MM-DD' -> {studied, correct}

let meta = {
  maxQuizStreak: 0,
  earlyBird: false,
  nightOwl: false,
  srsDoneToday: { date:'', count:0 },
  badges: []
};

let phoneticCache = {};

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function loadState(){
  try{
    const p = localStorage.getItem(LS_PROGRESS);
    if(p){
      const saved = JSON.parse(p);
      Object.keys(saved).forEach(no=>{
        if(progress[no]){
          progress[no] = saved[no];
          if(!progress[no].srs) progress[no].srs = freshSRS();
        }
      });
    }
  }catch(e){}
  try{
    const h = localStorage.getItem(LS_HISTORY);
    if(h) history = JSON.parse(h);
  }catch(e){}
  try{
    const s = localStorage.getItem(LS_SETTINGS);
    if(s){
      const saved = JSON.parse(s);
      if(typeof saved.autoSpeak === 'boolean') state.autoSpeak = saved.autoSpeak;
      if(typeof saved.listenRate === 'number') state.listenRate = saved.listenRate;
    }
  }catch(e){}
  try{
    const m = localStorage.getItem(LS_META);
    if(m) meta = Object.assign(meta, JSON.parse(m));
  }catch(e){}
  try{
    const ph = localStorage.getItem(LS_PHONETIC);
    if(ph) phoneticCache = JSON.parse(ph);
  }catch(e){}
}

function saveMeta(){
  try{ localStorage.setItem(LS_META, JSON.stringify(meta)); }catch(e){}
}
function savePhoneticCache(){
  try{ localStorage.setItem(LS_PHONETIC, JSON.stringify(phoneticCache)); }catch(e){}
}

function saveSettings(){
  try{
    localStorage.setItem(LS_SETTINGS, JSON.stringify({ autoSpeak: state.autoSpeak, listenRate: state.listenRate }));
  }catch(e){}
}

let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(LS_PROGRESS, JSON.stringify(progress));
      localStorage.setItem(LS_HISTORY, JSON.stringify(history));
    }catch(e){}
  }, 250);
}

function recordAnswer(correct){
  const t = todayStr();
  if(!history[t]) history[t] = {studied:0, correct:0};
  history[t].studied++;
  if(correct) history[t].correct++;
  saveState();
}

/* ---------- SRS (spaced repetition, simplified SM-2) ---------- */
function srsUpdate(no, ok){
  const p = progress[no];
  if(!p.srs) p.srs = freshSRS();
  const s = p.srs;
  const quality = ok ? 5 : 2;
  if(quality < 3){
    s.reps = 0;
    s.interval = 1;
  } else {
    if(s.reps === 0) s.interval = 1;
    else if(s.reps === 1) s.interval = 6;
    else s.interval = Math.max(1, Math.round(s.interval * s.ease));
    s.reps++;
  }
  s.ease = Math.max(1.3, s.ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  s.lastReview = Date.now();
  s.due = Date.now() + s.interval * 24 * 60 * 60 * 1000;
}

function srsDueCount(){
  const now = Date.now();
  return WORDS.filter(w => progress[w.no].srs && progress[w.no].srs.due <= now && progress[w.no].srs.lastReview !== null).length;
}

function computeForgettingCurve(){
  const studied = WORDS.filter(w => progress[w.no].srs && progress[w.no].srs.lastReview);
  if(studied.length===0) return null;
  const stabilities = studied.map(w => Math.max(1, progress[w.no].srs.interval || 1));
  const avgStability = stabilities.reduce((a,b)=>a+b,0)/stabilities.length;
  const curve = [];
  for(let t=0;t<=14;t++){
    curve.push(Math.round(Math.exp(-t/avgStability)*100));
  }
  const now = Date.now();
  const currentRetentions = studied.map(w=>{
    const s = progress[w.no].srs;
    const daysSince = Math.max(0, (now - s.lastReview)/(24*60*60*1000));
    const stab = Math.max(1, s.interval || 1);
    return Math.exp(-daysSince/stab)*100;
  });
  const avgCurrent = Math.round(currentRetentions.reduce((a,b)=>a+b,0)/currentRetentions.length);
  return { curve, avgStability, avgCurrent };
}

function computeUpcomingReviews(){
  const days = [];
  const now = new Date(); now.setHours(0,0,0,0);
  for(let i=0;i<14;i++){
    const d = new Date(now); d.setDate(now.getDate()+i);
    const dEnd = new Date(d); dEnd.setDate(d.getDate()+1);
    const count = WORDS.filter(w=>{
      const s = progress[w.no].srs;
      return s && s.lastReview && s.due>=d.getTime() && s.due<dEnd.getTime();
    }).length;
    days.push({ label:(d.getMonth()+1)+'/'+d.getDate(), count });
  }
  return days;
}

function refreshSrsBadge(){
  const el = document.getElementById('srs-due-badge');
  if(!el) return;
  const n = srsDueCount();
  el.textContent = n;
  el.classList.toggle('hidden', n===0);
}

/* ---------- centralized answer handling: progress + SRS + meta + badges ---------- */
function applyAnswer(no, ok){
  const p = progress[no];
  if(ok){ p.correct++; p.status='mastered'; }
  else{ p.wrong++; p.status='review'; }
  srsUpdate(no, ok);
  recordAnswer(ok);

  const hour = new Date().getHours();
  if(hour>=0 && hour<4) meta.nightOwl = true;
  if(hour>=5 && hour<7) meta.earlyBird = true;
  if(ok) state.streak = (state.streak||0)+1; else state.streak = 0;
  if(state.streak > meta.maxQuizStreak) meta.maxQuizStreak = state.streak;

  const t = todayStr();
  if(state.mode==='srs'){
    if(meta.srsDoneToday.date !== t){ meta.srsDoneToday = {date:t, count:0}; }
    meta.srsDoneToday.count++;
  }
  saveMeta();
  checkBadges();
  refreshSrsBadge();
}

/* ---------- theme ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-label').textContent = theme==='dark' ? 'ライト' : 'ダーク';
  document.getElementById('theme-toggle').firstChild.textContent = theme==='dark' ? '☀️ ' : '🌙 ';
  try{ localStorage.setItem(LS_THEME, theme); }catch(e){}
}
(function initTheme(){
  let theme = 'light';
  try{
    const saved = localStorage.getItem(LS_THEME);
    if(saved) theme = saved;
    else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme='dark';
  }catch(e){}
  applyTheme(theme);
})();
document.getElementById('theme-toggle').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur==='dark' ? 'light' : 'dark');
});

/* ---------- mode menu (hamburger) ---------- */
const MODE_LABELS = {
  flash:  '📇 フラッシュカード',
  quiz:   '✅ 4択クイズ',
  spell:  '✏️ スペルテスト',
  listen: '🎧 リスニング',
  srs:    '🧠 SRS復習',
  retest: '🔄 習得済み再テスト',
  range:  '🔢 番号指定',
  list:   '📋 単語一覧',
  badges: '🏆 実績',
  dash:   '📊 ダッシュボード',
};
function closeModePanel(){
  const panel = document.getElementById('mode-panel');
  const overlay = document.getElementById('mode-panel-overlay');
  const toggle = document.getElementById('menu-toggle');
  if(panel) panel.classList.remove('open');
  if(overlay) overlay.classList.remove('open');
  if(toggle) toggle.setAttribute('aria-expanded', 'false');
}
function openModePanel(){
  const panel = document.getElementById('mode-panel');
  const overlay = document.getElementById('mode-panel-overlay');
  const toggle = document.getElementById('menu-toggle');
  if(panel) panel.classList.add('open');
  if(overlay) overlay.classList.add('open');
  if(toggle) toggle.setAttribute('aria-expanded', 'true');
}
function syncTabbtn(mode){
  document.querySelectorAll('.tabbtn').forEach(t=>t.classList.toggle('active', t.dataset.mode===mode));
  const label = document.getElementById('menu-toggle-label');
  if(label) label.textContent = MODE_LABELS[mode] || mode;
  closeModePanel();
}
(function initModeMenu(){
  const toggle = document.getElementById('menu-toggle');
  const overlay = document.getElementById('mode-panel-overlay');
  if(!toggle) return;
  toggle.addEventListener('click', ()=>{
    const panel = document.getElementById('mode-panel');
    if(panel && panel.classList.contains('open')) closeModePanel();
    else { closeRangePanel(); openModePanel(); }
  });
  if(overlay) overlay.addEventListener('click', closeModePanel);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModePanel(); closeRangePanel(); } });
})();

/* ---------- 出題範囲メニュー（2つ目のハンバーガー） ---------- */
function closeRangePanel(){
  const panel = document.getElementById('range-panel');
  const overlay = document.getElementById('range-panel-overlay');
  const toggle = document.getElementById('range-toggle');
  if(panel) panel.classList.remove('open');
  if(overlay) overlay.classList.remove('open');
  if(toggle) toggle.setAttribute('aria-expanded', 'false');
}
function openRangePanel(){
  const panel = document.getElementById('range-panel');
  const overlay = document.getElementById('range-panel-overlay');
  const toggle = document.getElementById('range-toggle');
  if(panel) panel.classList.add('open');
  if(overlay) overlay.classList.add('open');
  if(toggle) toggle.setAttribute('aria-expanded', 'true');
}
function updateRangeToggleLabel(){
  const label = document.getElementById('range-toggle-label');
  if(!label) return;
  if(state.sectionStart===1 && state.sectionEnd===WORDS.length){
    label.textContent = '出題範囲: 全範囲';
  } else {
    label.textContent = `出題範囲: ${state.sectionStart}–${state.sectionEnd}`;
  }
}
(function initRangeMenu(){
  const toggle = document.getElementById('range-toggle');
  const overlay = document.getElementById('range-panel-overlay');
  if(!toggle) return;
  toggle.addEventListener('click', ()=>{
    const panel = document.getElementById('range-panel');
    if(panel && panel.classList.contains('open')) closeRangePanel();
    else { closeModePanel(); openRangePanel(); }
  });
  if(overlay) overlay.addEventListener('click', closeRangePanel);
})();

function normalize(s){ return s.trim().toLowerCase().replace(/\s+/g,' '); }

let state = {
  mode:'flash',
  sectionStart:1,
  sectionEnd:100,
  filter:'all', // all | review
  order:[],
  customOrder:null,
  pos:0,
  flipped:false,
  showEx:false,
  quizDir:'en2ja',
  spellDir:'ja2en',
  streak:0,
  quizLocked:false,
  listenRate:1.0,
  listenLocked:false,
  autoSpeak:true,
  srsMode:false,
};

const SEC_SIZE = 100;
const totalSections = Math.ceil(WORDS.length / SEC_SIZE);

function currentPool(){
  let start = state.sectionStart, end = state.sectionEnd;
  let pool = WORDS.filter(w => w.no >= start && w.no <= end);
  if(state.filter === 'review'){
    pool = pool.filter(w => progress[w.no].status === 'review');
  } else if(state.filter === 'mastered'){
    pool = pool.filter(w => progress[w.no].status === 'mastered');
  } else if(state.filter === 'due'){
    const now = Date.now();
    pool = pool.filter(w => progress[w.no].srs && progress[w.no].srs.due <= now && progress[w.no].srs.lastReview !== null);
    pool = pool.sort((a,b)=>progress[a.no].srs.due - progress[b.no].srs.due);
  }
  return pool;
}

function rebuildOrder(keepPos){
  if(state.customOrder){
    state.order = state.customOrder;
    state.customOrder = null;
    state.pos = 0; state.flipped=false;
    return;
  }
  const pool = currentPool();
  state.order = pool.map(w => w.no);
  if(!keepPos){ state.pos = 0; }
  if(state.pos >= state.order.length) state.pos = 0;
  state.flipped = false;
}

function shuffleOrder(){
  for(let i=state.order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [state.order[i],state.order[j]] = [state.order[j],state.order[i]];
  }
  state.pos = 0; state.flipped=false;
}

function wordByNo(no){ return WORDS[no-1]; }

function updateStats(){
  let n=0,r=0,m=0;
  WORDS.forEach(w=>{
    const s = progress[w.no].status;
    if(s==='new') n++; else if(s==='review') r++; else if(s==='mastered') m++;
  });
  document.getElementById('stat-new').textContent = n;
  document.getElementById('stat-review').textContent = r;
  document.getElementById('stat-mastered').textContent = m;
}

/* ---------- render root ---------- */
const main = document.getElementById('main');

function render(){
  updateStats();
  refreshSrsBadge();
  if(state.mode==='flash') renderFlash();
  else if(state.mode==='quiz') renderQuizSetup();
  else if(state.mode==='spell') renderSpellSetup();
  else if(state.mode==='listen') renderListenSetup();
  else if(state.mode==='srs') renderSrsMode();
  else if(state.mode==='retest') renderRetestMode();
  else if(state.mode==='range') renderRangeSetup();
  else if(state.mode==='list') renderList();
  else if(state.mode==='badges') renderBadgesPage();
  else if(state.mode==='dash') renderDashboard();
}

function sectionPickerHTML(){
  let secs = '';
  for(let s=1;s<=totalSections;s++){
    const start = (s-1)*SEC_SIZE+1;
    const end = Math.min(s*SEC_SIZE, WORDS.length);
    const active = (state.sectionStart===start && state.sectionEnd===end) ? 'active':'';
    const secWords = WORDS.slice(start-1,end);
    const doneCount = secWords.filter(w=>progress[w.no].status==='mastered').length;
    const pct = Math.round((doneCount/secWords.length)*100);
    secs += `<button class="sec-btn ${active}" data-start="${start}" data-end="${end}">${start}–${end}<small>Section ${s}</small><div class="sec-progress"><i style="width:${pct}%"></i></div></button>`;
  }
  const allActive = (state.sectionStart===1 && state.sectionEnd===WORDS.length) ? 'active':'';
  return `
  <div class="picker-row">
    <div class="picker-title">出題範囲を選ぶ</div>
    <div class="chiprow">
      <button class="chip ${allActive}" id="chip-all">全範囲(1–${WORDS.length})</button>
      <button class="chip warn ${state.filter==='review'?'active':''}" id="chip-review">🔴 復習リストのみ</button>
    </div>
  </div>
  <div class="section-grid">${secs}</div>`;
}

function bindSectionPicker(){
  document.querySelectorAll('.sec-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      state.sectionStart = parseInt(b.dataset.start);
      state.sectionEnd = parseInt(b.dataset.end);
      afterRangeChange();
    });
  });
  document.getElementById('chip-all').addEventListener('click',()=>{
    state.sectionStart=1; state.sectionEnd=WORDS.length; afterRangeChange();
  });
  document.getElementById('chip-review').addEventListener('click',()=>{
    state.filter = state.filter==='review' ? 'all' : 'review';
    afterRangeChange();
  });
}

function afterRangeChange(){
  rebuildOrder(false);
  closeRangePanel();
  render();
}

/* 出題範囲ハンバーガー（📚）の中身を作り直して表示する */
function renderRangeMenu(){
  const group = document.getElementById('range-menu-group');
  const panel = document.getElementById('range-panel');
  if(!group || !panel) return;
  group.classList.remove('hidden');
  panel.innerHTML = sectionPickerHTML();
  bindSectionPicker();
  updateRangeToggleLabel();
}
/* 出題範囲を使わないモードでは2つ目のハンバーガーごと隠す */
function hideRangeMenu(){
  const group = document.getElementById('range-menu-group');
  if(group) group.classList.add('hidden');
  closeRangePanel();
}

function exampleBoxHTML(w){
  return `<div class="example-box" id="example-box"><div class="en">${w.ex_en}</div><div class="ja">${w.ex_ja}</div></div>`;
}

/* ---------- FLASHCARD MODE ---------- */
function renderFlash(){
  rebuildOrder(true);
  renderRangeMenu();
  main.innerHTML = `<div id="flash-body"></div>`;
  renderFlashBody();
}

function renderFlashBody(){
  const body = document.getElementById('flash-body');
  const pool = state.order;
  if(pool.length===0){
    body.innerHTML = `<div class="empty">この範囲には単語がありません。復習リストが空かもしれません 🎉</div>`;
    return;
  }
  if(state.pos>=pool.length) state.pos=0;
  const no = pool[state.pos];
  const w = wordByNo(no);
  const pct = Math.round(((state.pos+1)/pool.length)*100);

  body.innerHTML = `
    <div class="card-stage">
      <div class="progress-line">
        <span>${state.pos+1} / ${pool.length}</span>
        <div class="progress-bar"><i style="width:${pct}%"></i></div>
        <span>${pct}%</span>
      </div>
      <div class="flashcard" id="flashcard">
        <div class="no">No. ${String(w.no).padStart(4,'0')}</div>
        <div class="face" id="face">${w.word}</div>
        <div class="phonetic" id="phonetic"></div>
        <div class="hint">${state.flipped ? 'クリックで単語に戻る' : 'クリック / スペースキーで意味を表示'}</div>
        <div class="stamp ok" id="stamp-ok">済</div>
        <div class="stamp ng" id="stamp-ng">✕</div>
      </div>
      ${exampleBoxHTML(w)}
      ${TTS_SUPPORTED ? `
      <div class="flash-audio-row">
        <button class="btn ghost" id="btn-speak">🔊 発音 <span class="kbd">S</span></button>
        <button class="btn ghost ${state.autoSpeak ? 'toggle-on' : ''}" id="btn-autospeak">${state.autoSpeak ? '🔔 自動読み上げ:ON' : '🔕 自動読み上げ:OFF'}</button>
        <div class="listen-rate">
          ${[0.7,1.0,1.3].map(r=>`<button class="rate-btn ${state.listenRate===r?'active':''}" data-rate="${r}">${r}×</button>`).join('')}
        </div>
      </div>` : ''}
      <div class="card-controls">
        <button class="btn ng" id="btn-ng">✕ もう一度 <span class="kbd">2</span></button>
        <button class="btn ghost" id="btn-ex">📖 例文 <span class="kbd">E</span></button>
        <button class="btn ghost" id="btn-shuffle">🔀 シャッフル</button>
        <button class="btn ok" id="btn-ok">◯ わかる <span class="kbd">1</span></button>
      </div>
      <div class="navrow">
        <button id="nav-prev">←</button>
        <span>矢印キーで前後に移動 ・ <span class="kbd">Space</span> でめくる ・ <span class="kbd">E</span> で例文</span>
        <button id="nav-next">→</button>
      </div>
    </div>`;

  const card = document.getElementById('flashcard');
  const face = document.getElementById('face');
  const phon = document.getElementById('phonetic');
  function paintFace(){
    if(state.flipped){
      face.textContent = w.mean;
      face.classList.add('ja');
      if(phon) phon.classList.add('hidden');
    } else {
      face.textContent = w.word;
      face.classList.remove('ja');
      if(phon) phon.classList.remove('hidden');
    }
  }
  paintFace();
  renderPhonetic(w.word, 'phonetic');
  if(state.showEx) document.getElementById('example-box').classList.add('show');
  card.addEventListener('click', ()=>{
    state.flipped = !state.flipped;
    paintFace();
    document.querySelector('.hint').textContent = state.flipped ? 'クリックで単語に戻る' : 'クリック / スペースキーで意味を表示';
  });
  document.getElementById('btn-ex').addEventListener('click', ()=>{
    state.showEx = !state.showEx;
    document.getElementById('example-box').classList.toggle('show', state.showEx);
  });
  document.getElementById('btn-shuffle').addEventListener('click', shuffleAndRender);
  document.getElementById('nav-prev').addEventListener('click', ()=>stepCard(-1));
  document.getElementById('nav-next').addEventListener('click', ()=>stepCard(1));
  document.getElementById('btn-ok').addEventListener('click', ()=>markCard(true));
  document.getElementById('btn-ng').addEventListener('click', ()=>markCard(false));

  if(TTS_SUPPORTED){
    document.getElementById('btn-speak').addEventListener('click', ()=>speakWord(w.word));
    document.getElementById('btn-autospeak').addEventListener('click', ()=>{
      state.autoSpeak = !state.autoSpeak;
      saveSettings();
      renderFlashBody();
    });
    document.querySelectorAll('.flash-audio-row .rate-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        state.listenRate = parseFloat(b.dataset.rate);
        saveSettings();
        renderFlashBody();
      });
    });
    if(state.autoSpeak) speakWord(w.word);
  }
}

function shuffleAndRender(){ shuffleOrder(); renderFlashBody(); }

function stepCard(delta){
  const len = state.order.length;
  if(len===0) return;
  state.pos = (state.pos + delta + len) % len;
  state.flipped = false;
  state.showEx = false;
  renderFlashBody();
}

function markCard(ok){
  const no = state.order[state.pos];
  showStamp(ok?'ok':'ng');
  applyAnswer(no, ok);
  updateStats();
  setTimeout(()=>{ state.showEx=false; stepCard(1); }, 320);
}

function showStamp(kind){
  const el = document.getElementById(kind==='ok'?'stamp-ok':'stamp-ng');
  if(!el) return;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

/* ---------- QUIZ MODE (4-choice) ---------- */
function renderQuizSetup(){
  rebuildOrder(false);
  shuffleOrder();
  renderRangeMenu();
  main.innerHTML =
    `<div class="chiprow" style="margin-bottom:16px;">
       <button class="chip ${state.quizDir==='en2ja'?'active':''}" id="dir-en2ja">英語 → 意味</button>
       <button class="chip ${state.quizDir==='ja2en'?'active':''}" id="dir-ja2en">意味 → 英語</button>
     </div>
     <div id="quiz-body"></div>`;
  document.getElementById('dir-en2ja').addEventListener('click',()=>{state.quizDir='en2ja'; renderQuizSetup();});
  document.getElementById('dir-ja2en').addEventListener('click',()=>{state.quizDir='ja2en'; renderQuizSetup();});
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const body = document.getElementById('quiz-body');
  const pool = state.order;
  if(pool.length < 4){
    body.innerHTML = `<div class="empty">4択クイズを出題するには、この範囲に最低4語必要です。範囲を広げてください。</div>`;
    return;
  }
  if(state.pos>=pool.length){ state.pos=0; }
  const no = pool[state.pos];
  const w = wordByNo(no);
  state.quizLocked = false;

  const wrongPool = WORDS.filter(x=>x.no!==no);
  const wrongs = [];
  while(wrongs.length<3){
    const cand = wrongPool[Math.floor(Math.random()*wrongPool.length)];
    if(!wrongs.includes(cand)) wrongs.push(cand);
  }
  const choices = [w, ...wrongs].map(c => state.quizDir==='en2ja' ? c.mean : c.word);
  for(let i=choices.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [choices[i],choices[j]]=[choices[j],choices[i]]; }
  const answer = state.quizDir==='en2ja' ? w.mean : w.word;
  const promptText = state.quizDir==='en2ja' ? w.word : w.mean;
  const promptCls = state.quizDir==='en2ja' ? 'en' : '';

  body.innerHTML = `
    <div class="quiz-wrap">
      <div class="progress-line" style="margin-bottom:14px;">
        <span>${state.pos+1} / ${pool.length}</span>
        <div class="progress-bar"><i style="width:${Math.round(((state.pos+1)/pool.length)*100)}%"></i></div>
      </div>
      <div class="quiz-q">
        <div class="no">No. ${String(w.no).padStart(4,'0')}</div>
        <div class="prompt ${promptCls}">${promptText}</div>
        <div class="choices">
          ${choices.map((c,i)=>`<button class="choice" data-choice="${encodeURIComponent(c)}">${c}</button>`).join('')}
        </div>
      </div>
      <div id="quiz-ex"></div>
      <div class="streak">連続正解 <b id="streak-n">${state.streak}</b></div>
      <div class="quiz-footer"><button class="btn primary hidden" id="quiz-next">次の問題へ →</button></div>
    </div>`;

  document.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.quizLocked) return;
      state.quizLocked = true;
      const chosen = decodeURIComponent(btn.dataset.choice);
      document.querySelectorAll('.choice').forEach(b=>{
        const val = decodeURIComponent(b.dataset.choice);
        if(val===answer) b.classList.add('correct');
        else if(b===btn) b.classList.add('wrong');
        else b.classList.add('dim');
      });
      const ok = chosen===answer;
      applyAnswer(no, ok);
      document.getElementById('streak-n').textContent = state.streak;
      document.getElementById('quiz-ex').innerHTML = exampleBoxHTML(w).replace('example-box','example-box show');
      updateStats();
      document.getElementById('quiz-next').classList.remove('hidden');
      document.getElementById('quiz-next').addEventListener('click', ()=>{
        state.pos = (state.pos+1) % pool.length;
        renderQuizQuestion();
      }, {once:true});
    });
  });
}

/* ---------- SPELL MODE ---------- */
function renderSpellSetup(){
  rebuildOrder(false);
  shuffleOrder();
  renderRangeMenu();
  main.innerHTML = `<div id="spell-body"></div>`;
  renderSpellQuestion();
}

function renderSpellQuestion(){
  const body = document.getElementById('spell-body');
  const pool = state.order;
  if(pool.length===0){
    body.innerHTML = `<div class="empty">この範囲には単語がありません。</div>`;
    return;
  }
  if(state.pos>=pool.length) state.pos=0;
  const no = pool[state.pos];
  const w = wordByNo(no);

  body.innerHTML = `
    <div class="quiz-wrap">
      <div class="progress-line" style="margin-bottom:14px;">
        <span>${state.pos+1} / ${pool.length}</span>
        <div class="progress-bar"><i style="width:${Math.round(((state.pos+1)/pool.length)*100)}%"></i></div>
      </div>
      <div class="quiz-q">
        <div class="no">No. ${String(w.no).padStart(4,'0')}</div>
        <div class="prompt">${w.mean}</div>
        <input type="text" class="spell-input" id="spell-input" placeholder="英単語を入力" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="spell-fb" id="spell-fb"></div>
      </div>
      <div id="spell-ex"></div>
      <div class="quiz-footer">
        <button class="btn ghost" id="spell-skip">わからない（答えを見る）</button>
        <button class="btn primary" id="spell-check">✓ 答え合わせ <span class="kbd">Enter</span></button>
      </div>
    </div>`;

  const input = document.getElementById('spell-input');
  input.focus();
  const fb = document.getElementById('spell-fb');
  let locked = false;

  function finish(){
    document.getElementById('spell-ex').innerHTML = exampleBoxHTML(w).replace('example-box','example-box show');
    updateStats();
    document.getElementById('spell-check').textContent = '次へ →';
    input.disabled = true;
  }
  function check(){
    if(locked) return;
    locked = true;
    if(normalize(input.value)===normalize(w.word)){
      applyAnswer(no, true);
      fb.textContent = '◯ 正解！'; fb.className='spell-fb ok';
    } else {
      applyAnswer(no, false);
      fb.textContent = `✕ 正解: ${w.word}`; fb.className='spell-fb ng';
    }
    finish();
  }
  function reveal(){
    if(locked) return;
    locked = true;
    applyAnswer(no, false);
    fb.textContent = `答え: ${w.word}`; fb.className='spell-fb ng';
    finish();
  }
  document.getElementById('spell-check').addEventListener('click', ()=>{
    if(!locked) check();
    else { state.pos=(state.pos+1)%pool.length; renderSpellQuestion(); }
  });
  document.getElementById('spell-skip').addEventListener('click', reveal);
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      if(!locked) check();
      else { state.pos=(state.pos+1)%pool.length; renderSpellQuestion(); }
    }
  });
}

/* ---------- LISTENING MODE ---------- */
const TTS_SUPPORTED = ('speechSynthesis' in window);
function speakWord(word){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = state.listenRate;
  window.speechSynthesis.speak(u);
}

function renderListenSetup(){
  rebuildOrder(false);
  shuffleOrder();
  renderRangeMenu();
  main.innerHTML = `<div id="listen-body"></div>`;
  if(!('speechSynthesis' in window)){
    document.getElementById('listen-body').innerHTML = `<div class="empty">お使いのブラウザは音声読み上げに対応していません。</div>`;
    return;
  }
  renderListenQuestion();
}

    body.innerHTML = `<div class="empty">リスニングモードには、この範囲に最低4語必要です。範囲を広げてください。</div>`;
    return;
  }
  if(state.pos>=pool.length){ state.pos=0; }
  const no = pool[state.pos];
  const w = wordByNo(no);
  state.listenLocked = false;

  const wrongPool = WORDS.filter(x=>x.no!==no);
  const wrongs = [];
  while(wrongs.length<3){
    const cand = wrongPool[Math.floor(Math.random()*wrongPool.length)];
    if(!wrongs.includes(cand)) wrongs.push(cand);
  }
  const choices = [w, ...wrongs].map(c => c.mean);
  for(let i=choices.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [choices[i],choices[j]]=[choices[j],choices[i]]; }

  body.innerHTML = `
    <div class="quiz-wrap">
      <div class="progress-line" style="margin-bottom:14px;">

        <div class="progress-bar"><i style="width:${Math.round(((state.pos+1)/pool.length)*100)}%"></i></div>
      </div>
      <div class="quiz-q">
        <div class="no">No. ${String(w.no).padStart(4,'0')}</div>
        <button class="listen-play" id="listen-play">🔊</button>
        <div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">タップして発音を聞く</div>
        <div class="listen-rate">
          ${rates.map(r=>`<button class="rate-btn ${state.listenRate===r?'active':''}" data-rate="${r}">${r}×</button>`).join('')}
        </div>
        <div class="choices" style="margin-top:22px;">
          ${choices.map((c,i)=>`<button class="choice" data-choice="${encodeURIComponent(c)}">${c}</button>`).join('')}
        </div>
      </div>
      <div id="listen-ex"></div>
      <div class="streak">連続正解 <b id="streak-n">${state.streak}</b></div>
      <div class="quiz-footer"><button class="btn primary hidden" id="listen-next">次の問題へ →</button></div>
    </div>`;

  document.getElementById('listen-play').addEventListener('click', ()=>speakWord(w.word));
  document.querySelectorAll('.rate-btn').forEach(b=>{

/* ---------- RANGE-BY-NUMBER MODE ---------- */
function renderRangeSetup(){
  hideRangeMenu();
  const maxNo = WORDS.length;
  if(state.rangeStart == null) state.rangeStart = 1;
  if(state.rangeEnd == null) state.rangeEnd = Math.min(100, maxNo);

  main.innerHTML = `
    <div class="range-wrap">
      <div class="picker-title" style="margin-bottom:10px;">単語番号を指定してテスト範囲を決める</div>
      <div class="range-inputs">
        <label>開始番号 (No.)
          <input type="number" id="range-start" class="range-input" min="1" max="${maxNo}" value="${state.rangeStart}">
        </label>
        <span class="range-sep">〜</span>
        <label>終了番号 (No.)
          <input type="number" id="range-end" class="range-input" min="1" max="${maxNo}" value="${state.rangeEnd}">
        </label>
      </div>
      <div class="range-hint">No.1 〜 No.${maxNo} の間で指定してください（例: 301〜400）</div>
      <div class="range-err" id="range-err"></div>
      <div class="range-count" id="range-count"></div>
      <hr class="tear">
      <div class="picker-title" style="margin-bottom:10px;">この範囲で始めるモードを選ぶ</div>
      <div class="range-modes">
        <button class="btn primary" id="range-flash">📇 フラッシュカード</button>
        <button class="btn primary" id="range-quiz">✅ 4択クイズ</button>
        <button class="btn primary" id="range-spell">✏️ スペルテスト</button>
        <button class="btn primary" id="range-listen">🎧 リスニング</button>
      </div>
    </div>`;

  const startInput = document.getElementById('range-start');
  const endInput = document.getElementById('range-end');
  const errEl = document.getElementById('range-err');
  const countEl = document.getElementById('range-count');

  function updateCount(){
    const s = parseInt(startInput.value), e = parseInt(endInput.value);
    if(!isNaN(s) && !isNaN(e) && s>=1 && e<=maxNo && s<=e){
      countEl.textContent = `対象: No.${s} 〜 No.${e}（${e - s + 1} 語）`;
    } else {
      countEl.textContent = '';
    }
  }
  updateCount();
  startInput.addEventListener('input', updateCount);
  endInput.addEventListener('input', updateCount);

  function readRange(){
    const s = parseInt(startInput.value), e = parseInt(endInput.value);
    if(isNaN(s) || isNaN(e) || s<1 || e>maxNo || s>e){
      errEl.textContent = `正しい範囲を入力してください（1〜${maxNo}、開始番号 ≤ 終了番号）`;
      return null;
    }
    errEl.textContent = '';
    state.rangeStart = s;
    state.rangeEnd = e;
    return {s, e};
  }

  function startMode(mode, renderFn){
    const r = readRange();
    if(!r) return;
    state.sectionStart = r.s;
    state.sectionEnd = r.e;
    state.filter = 'all';
    state.customOrder = null;
    state.mode = mode;
    state.pos = 0; state.streak = 0; state.showEx = false; state.flipped = false;
    syncTabbtn(mode);
    renderFn();
  }

  document.getElementById('range-flash').addEventListener('click', ()=>startMode('flash', renderFlash));
  document.getElementById('range-quiz').addEventListener('click', ()=>startMode('quiz', renderQuizSetup));
  document.getElementById('range-spell').addEventListener('click', ()=>startMode('spell', renderSpellSetup));
  document.getElementById('range-listen').addEventListener('click', ()=>startMode('listen', renderListenSetup));
}

/* ---------- LIST MODE ---------- */
function renderList(){
  renderRangeMenu();
  main.innerHTML = `
    <div class="list-controls">
      <input type="text" class="search" id="wt-search" placeholder="英単語・意味で検索…">
    </div>
    <div id="wt-wrap"></div>`;
  const wrap = document.getElementById('wt-wrap');
  function draw(filterText){
    let pool = WORDS.filter(w=>w.no>=state.sectionStart && w.no<=state.sectionEnd);
    if(state.filter==='review') pool = pool.filter(w=>progress[w.no].status==='review');
    if(filterText){
      const q = filterText.toLowerCase();
      pool = pool.filter(w=>w.word.toLowerCase().includes(q) || w.mean.includes(filterText));
    }
    if(pool.length===0){ wrap.innerHTML = `<div class="empty">該当する単語がありません。</div>`; return; }
    wrap.innerHTML = `<table class="wordtable"><thead><tr><th class="wt-no">No.</th><th class="wt-word">単語</th><th>意味</th><th>状態</th><th></th></tr></thead>
      <tbody>${pool.map(w=>{
        const st = progress[w.no].status;
        const label = st==='mastered'?'習得済み':st==='review'?'復習中':'未着手';
        return `<tr class="wt-row" data-no="${w.no}"><td class="wt-no">${w.no}</td><td class="wt-word" data-no="${w.no}">${w.word}<span class="wt-phon" id="wt-phon-${w.no}"></span></td><td>${w.mean}</td>
          <td><span class="badge ${st}">${label}</span></td>
          <td><button class="jumpbtn" data-no="${w.no}">カードで見る</button></td></tr>
          <tr class="ex-row hidden" data-for="${w.no}"><td></td><td colspan="4"><div class="en">${w.ex_en}</div><div>${w.ex_ja}</div></td></tr>`;
      }).join('')}</tbody></table>`;
    wrap.querySelectorAll('.jumpbtn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const no = parseInt(b.dataset.no);
        state.mode='flash';
        syncTabbtn('flash');
        rebuildOrder(false);
        const idx = state.order.indexOf(no);
        state.pos = idx>=0 ? idx : 0;
        renderFlash();
      });
    });
    wrap.querySelectorAll('.wt-word').forEach(el=>{
      el.addEventListener('click', ()=>{
        const row = wrap.querySelector(`.ex-row[data-for="${el.dataset.no}"]`);
        if(row) row.classList.toggle('hidden');
        const w = wordByNo(parseInt(el.dataset.no));
        renderPhonetic(w.word, `wt-phon-${el.dataset.no}`);
      });
    });
  }
  draw('');
  document.getElementById('wt-search').addEventListener('input', e=>draw(e.target.value));
}

/* ---------- SRS REVIEW MODE ---------- */
function renderSrsMode(){
  hideRangeMenu();
  state.filter = 'due';
  state.sectionStart = 1; state.sectionEnd = WORDS.length;
  rebuildOrder(false);
  const dueTotal = state.order.length;
  const doneToday = meta.srsDoneToday.date===todayStr() ? meta.srsDoneToday.count : 0;
  main.innerHTML = `
    <div class="picker-row"><div class="picker-title">🧠 SRS復習（間隔反復）</div></div>
    <div class="srs-info">今日復習すべき単語: <b>${dueTotal}</b> 語　${doneToday>0 ? `（本日 ${doneToday} 問完了 ✅）` : ''}</div>

/* ---------- PHONETIC (IPA) LOOKUP ---------- */
function renderPhonetic(word, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  if(phoneticCache[word]){
    el.textContent = phoneticCache[word] || '';
    return;
  }
  el.textContent = '…';
  el.classList.add('loading');
  fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`)
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      let ipa = '';
      for(const entry of data){
        if(entry.phonetic){ ipa = entry.phonetic; break; }
        if(entry.phonetics){
          const found = entry.phonetics.find(p=>p.text);
          if(found){ ipa = found.text; break; }
        }
      }
      phoneticCache[word] = ipa;
      savePhoneticCache();
      const stillThere = document.getElementById(targetId);
      if(stillThere){ stillThere.textContent = ipa; stillThere.classList.remove('loading'); }
    })
    .catch(()=>{
      phoneticCache[word] = '';
      savePhoneticCache();
      const stillThere = document.getElementById(targetId);
      if(stillThere){ stillThere.textContent = ''; stillThere.classList.remove('loading'); }
    });
}

function masteredCount(){

function studyStreakDays(){
  let n=0;
  const d = new Date();
  for(;;){
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(history[key] && history[key].studied>0){ n++; d.setDate(d.getDate()-1); }
    else break;
  }
  return n;
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tabbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    syncTabbtn(btn.dataset.mode);
    state.mode = btn.dataset.mode;
    state.pos = 0; state.streak=0; state.showEx=false;
    if(state.mode!=='srs' && state.mode!=='retest' && (state.filter==='due' || state.filter==='mastered')){
      state.filter = 'all';
    }
    render();
  });
});

/* ---------- keyboard shortcuts ---------- */
document.addEventListener('keydown', e=>{
  if(document.activeElement && document.activeElement.tagName==='INPUT') return;
  if(state.mode==='flash'){
    if(e.code==='Space'){ e.preventDefault(); document.getElementById('flashcard')?.click(); }
    else if(e.key==='ArrowRight'){ stepCard(1); }
    else if(e.key==='ArrowLeft'){ stepCard(-1); }
    else if(e.key==='1'){ markCard(true); }
    else if(e.key==='2'){ markCard(false); }
    else if(e.key==='e' || e.key==='E'){ document.getElementById('btn-ex')?.click(); }
    else if(e.key==='s' || e.key==='S'){ document.getElementById('btn-speak')?.click(); }
  }
});

/* ---------- export / import progress ---------- */
document.getElementById('btn-export').addEventListener('click', ()=>{
  const data = { savedAt: new Date().toISOString(), progress, history };
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'target1900_progress.json';
  a.click();
});
document.getElementById('btn-import').addEventListener('click', ()=>{
  document.getElementById('file-import').click();
});
document.getElementById('file-import').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(data.progress){
        Object.keys(data.progress).forEach(no=>{
          if(progress[no]) progress[no] = data.progress[no];
        });
      }
      if(data.history) history = data.history;
      saveState();
      updateStats();
      render();
      alert('進捗を読み込みました。');
    }catch(err){ alert('ファイルの読み込みに失敗しました。'); }
  };
  reader.readAsText(file);
});

/* ---------- init ---------- */
loadState();
state.sectionEnd = Math.min(SEC_SIZE, WORDS.length);
rebuildOrder(false);
checkBadges();
render();
</script>
