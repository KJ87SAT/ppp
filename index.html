<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">TARGET 1900 学習ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Spectral:ital,wght@0,400;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>

<header class="appbar">
  <div class="brand">
    <span class="mark">Lexicon</span>
    <div class="brand-text">
      <h1 id="brand-title">TARGET 1900 学習ノート</h1>
      <div class="sub" id="brand-sub">全 1900 語 ・ フラッシュカード / 4択クイズ / スペルテスト / リスニング</div>
    </div>
  </div>
  <div class="appbar-right">
    <div class="stat-pills">
      <div><span>未着手</span><b id="stat-new">0</b></div>
      <div class="stat-review"><span>復習中</span><b id="stat-review">0</b></div>
      <div class="stat-mastered"><span>習得済み</span><b id="stat-mastered">0</b></div>
    </div>
    <button class="icon-btn" id="due-badge-btn" title="今日復習すべき単語">🧠 <span class="due-count">0</span></button>
    <button class="icon-btn" id="settings-btn" title="設定" aria-haspopup="true" aria-expanded="false">⚙️</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-mode="flash">📇 フラッシュカード</button>
  <button class="tab" data-mode="quiz">✅ 4択クイズ</button>
  <button class="tab" data-mode="spell">✏️ スペルテスト</button>
  <button class="tab" data-mode="listen">🎧 リスニング</button>
  <button class="tab" data-mode="list">📋 単語一覧</button>
  <button class="tab" data-mode="dash">📊 ダッシュボード</button>
</nav>

<div class="toolbar" id="toolbar"></div>

<main id="main"></main>

<div class="popover-scrim" id="range-scrim"></div>
<div class="range-popover" id="range-popover"></div>

<div class="settings-panel" id="settings-panel"></div>

<div class="badge-toast" id="badge-toast"></div>

<script type="module" src="script.js"></script>
</body>
</html>
